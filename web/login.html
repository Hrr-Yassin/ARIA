<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PentestAI v9 — Login</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles/login.css">
</head>
<body>
<div class="login-card">
  <div class="logo">Pentest<span>AI</span></div>
  <div class="subtitle">v9 — Autonomous Penetration Testing</div>
  <div class="field">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username" autofocus>
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <button class="btn-login" id="login-btn" onclick="doLogin()">Sign In</button>
  <div class="error" id="error-msg"></div>
  <div class="footer">Authorized personnel only</div>
</div>
<script src="/static/scripts/login.js"></script>
</body>
</html>
